plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'maven-publish'
}

android {
    namespace "com.yundou.loans.core"
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.xiangfenr'
                artifactId = 'core'
                version = '1.0.4'
            }
        }
    }
}

kapt {
    correctErrorTypes = true
    arguments {
        arg("AROUTER_MODULE_NAME", project.getName())
    }
}

dependencies {
    // Kotlin & 协程
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.4.32"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.4.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.3"

    // Jetpack lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.3.1"

    // 网络相关
    implementation "com.squareup.okhttp3:okhttp:4.10.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.10.0"
    implementation "com.squareup.okhttp3:okhttp-urlconnection:4.10.0"
    implementation "com.squareup.okio:okio:2.6.0"

    implementation "com.squareup.retrofit2:retrofit:2.7.1"
    implementation "com.squareup.retrofit2:converter-gson:2.7.1"
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.7.1"
    implementation "com.squareup.retrofit2:converter-scalars:2.7.1"
    implementation "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2"

    // RxJava
    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation "io.reactivex.rxjava2:rxjava:2.2.2"

    api 'com.google.code.gson:gson:2.8.5'
    api 'androidx.appcompat:appcompat:1.3.0'

    // MMKV & ARouter（BaseApp 用）
    api 'com.tencent:mmkv:1.2.14'

    // Android 基础
    implementation 'androidx.core:core-ktx:1.7.0'

    //arouter
    api 'com.alibaba:arouter-api:1.5.2'
    kapt 'com.alibaba:arouter-compiler:1.5.2'

    //dialog
    api "com.afollestad.material-dialogs:lifecycle:3.1.1"
    api "com.afollestad.material-dialogs:core:3.1.1"

    api 'com.alibaba:fastjson:1.2.73'
    api 'com.alibaba:fastjson:1.1.72.android'
    api 'com.google.guava:guava:27.0.1-android'

    //glide
    api 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
//    api 'jp.wasabeef:glide-transformations:4.3.0'
    api 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    api 'com.google.code.gson:gson:2.8.5'

    //底部弹出的选择器
    api 'com.contrarywind:Android-PickerView:4.1.9'

    //PictureSelectors
    api 'io.github.lucksiege:pictureselector:v3.10.7'
    implementation 'io.github.lucksiege:compress:v3.10.7'
    implementation 'io.github.lucksiege:ucrop:v3.10.7'
    implementation 'io.github.lucksiege:camerax:v3.10.7'

    //eventbus
    api 'org.greenrobot:eventbus:3.1.1'
}

