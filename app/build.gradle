plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'io.github.qq549631030.android-junk-code' version '1.3.4'  // 应用 AndroidJunkCode 插件
}

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.xiaohuabao.xhb"
        minSdk 21
        targetSdk 33
        versionCode 10002
        versionName "1.00.02"
        flavorDimensions "default"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation":
                                     "$projectDir/schemas".toString()]
            }
        }
    }

    //打包名称配置
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // 获取渠道名称
            def channelName = variant.flavorName.capitalize()
            // 获取应用名称
            def appName = "XiaoHuaDouBao"  // 你可以在这里设置应用名称，或者从其他地方获取
            // 获取版本号
            def versionName = variant.versionName
            // 自定义 APK 文件名
            outputFileName = "${appName}-${versionName}-${channelName}-${variant.buildType.name}.apk"
        }
    }

    signingConfigs {
        release {
            storeFile file('../xiaohuadoubao.jks')
            storePassword 'jjdg888'
            keyAlias 'jjdg888'
            keyPassword 'jjdg888'
            // v1SigningEnabled true
            // v2SigningEnabled true
        }
    }


    productFlavors {
        RY {
            dimension "default"
            //替换AndroidManifest中的值
            manifestPlaceholders = [channel_value: "8"]
            signingConfig signingConfigs.release
        }
        qq {
            dimension "default"
            //替换AndroidManifest中的值
            manifestPlaceholders = [channel_value: "5"]
            signingConfig signingConfigs.release
        }
        //不同渠道
        XM {
            dimension "default"
            //替换AndroidManifest中的值
            manifestPlaceholders = [channel_value: "4"]
            signingConfig signingConfigs.release
        }
        //不同渠道
        HW {
            dimension "default"
            //替换AndroidManifest中的值
            manifestPlaceholders = [channel_value: "3"]
            signingConfig signingConfigs.release
        } //不同渠道
        OPPO {
            dimension "default"
            //替换AndroidManifest中的值
            manifestPlaceholders = [channel_value: "2"]
            signingConfig signingConfigs.release
        } //不同渠道
        VIVO {
            dimension "default"
            //替换AndroidManifest中的值
            manifestPlaceholders = [channel_value: "1"]
            signingConfig signingConfigs.release
        }

    }

    buildTypes {
        release {
            minifyEnabled true //启用代码混淆
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true

    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }
}


//防止马甲的配置
androidJunkCode {
    def config = {
        packageBase = "com.lexiang.loans.ui"
        packageCount = 30
        activityCountPerPackage = 3
        excludeActivityJavaFile = false
        otherCountPerPackage = 50
        methodCountPerClass = 20
        resPrefix = "junk_"
        drawableCount = 300
        stringCount = 300
    }
    variantConfig {
        //注意：这里的debug,release为变体名称，如果没有设置productFlavors就是buildType名称，如果有设置productFlavors就是flavor+buildType，例如（freeRelease、proRelease）
        debug config
        release config
    }
}

dependencies {

    implementation project(':core')
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation project(':core-ui')

    implementation 'androidx.core:core-ktx:1.7.0'

    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.firebase:firebase-crashlytics-buildtools:2.7.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'


    //Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.4.32"

    //协程
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.4.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.3"

    //ktx
    implementation "androidx.activity:activity-ktx:1.2.2"
    implementation "androidx.fragment:fragment-ktx:1.3.3"

    //OkHttp
    implementation "com.squareup.okhttp3:okhttp:4.9.0"
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'


    // retrofit
    implementation "com.squareup.retrofit2:retrofit:2.7.1"
    implementation "com.squareup.retrofit2:converter-gson:2.7.1"
    implementation "com.squareup.retrofit2:adapter-rxjava:2.7.1"
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.7.1"
    implementation "com.squareup.retrofit2:converter-scalars:2.7.1"
    implementation "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2"


    implementation "com.squareup.okhttp3:okhttp-urlconnection:4.10.0"
    implementation "com.squareup.okio:okio:2.6.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.10.0"
    implementation "com.squareup.okhttp3:okhttp:4.10.0"

    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation "io.reactivex.rxjava2:rxjava:2.2.2"


    //jetpack
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.3.1"
    //adapter
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.6'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'

    //mmkv
    implementation 'com.tencent:mmkv:1.2.14'



    implementation 'com.alibaba:fastjson:1.2.73'
    implementation 'com.alibaba:fastjson:1.1.72.android'
    implementation 'com.google.guava:guava:27.0.1-android'

    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.0.5.1'

    //implementation files("libs/oaid_sdk_1.0.25.aar")

    // 友盟统计SDK
    implementation 'com.umeng.umsdk:common:9.8.8'// 必选
    implementation 'com.umeng.umsdk:asms:1.4.0'// 必选

    //dialog
    api "com.afollestad.material-dialogs:lifecycle:3.1.1"
    api "com.afollestad.material-dialogs:core:3.1.1"

    // implementation 'org.greenrobot:eventbus:3.3.1' // EventBus
    implementation 'com.github.li-xiaojun:XPopup:2.10.0'

}